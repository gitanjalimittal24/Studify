    {label:'Download', primary:true, onClick:()=>downloadFile(f.id)}
  ], true);
}

/* ---- Upload flow (multi-step) ---- */
function openUploadModal(quick){
  uploadStep = quick ? 'quick' : 1;
  uploadDraft = { files:[], yearId: DB.ui.currentYearId, semesterId: DB.ui.currentSemesterId, subjectId:null, category:null, tags:[], teacher:'', description:'', unit:'', deadline:'' };
  renderUploadModal();
}
function renderUploadModal(){
  if(DB.years.length===0){ toast('Create an academic year and subject first','error'); return; }
  let body, footer;
  if(uploadStep==='quick'){
    body = `
      <div class="dropzone" id="dz" onclick="document.getElementById('fileInput').click()">
        📤 Drag & drop files here, or click to browse<br><span style="font-size:11px;">Files will be saved to Inbox — organize them anytime later from Files.</span>
      </div>
      <input type="file" id="fileInput" multiple style="display:none" onchange="handleFilePick(this.files)">
      <div id="fileListPreview" class="mt24"></div>
    `;
    footer = [{label:'Save to Inbox', primary:true, onClick:()=>finishQuickUpload()}];
  } else if(uploadStep===1){
    body = `
      <div class="step-indicator"><div class="done"></div><div></div><div></div></div>
      <div class="dropzone" id="dz" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)" onclick="document.getElementById('fileInput').click()">
        📤 Drag & drop files here, or click to browse
      </div>
      <input type="file" id="fileInput" multiple style="display:none" onchange="handleFilePick(this.files)">
      <div id="fileListPreview" class="mt24"></div>
    `;
    footer = [{label:'Next →', primary:true, onClick:()=>{ if(uploadDraft.files.length===0){toast('Select at least one file','error');return;} uploadStep=2; renderUploadModal(); }}];
  } else if(uploadStep===2){
    const sems = uploadDraft.yearId? semestersForYear(uploadDraft.yearId):[];
    const subs = uploadDraft.semesterId? subjectsForSemester(uploadDraft.semesterId):[];
    body = `
      <div class="step-indicator"><div class="done"></div><div class="done"></div><div></div></div>
      <div class="field"><label>Academic Year</label><select id="upYear" onchange="uploadDraft.yearId=this.value; uploadDraft.semesterId=null; renderUploadModal();">
        ${DB.years.map(y=>`<option value="${y.id}" ${y.id===uploadDraft.yearId?'selected':''}>${escapeHtml(y.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Semester</label><select id="upSem" onchange="uploadDraft.semesterId=this.value; uploadDraft.subjectId=null; renderUploadModal();">
        <option value="">Select…</option>${sems.map(s=>`<option value="${s.id}" ${s.id===uploadDraft.semesterId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Subject</label><select id="upSubj" onchange="uploadDraft.subjectId=this.value; uploadDraft.category=null; renderUploadModal();">
        <option value="">Select…</option>${subs.map(s=>`<option value="${s.id}" ${s.id===uploadDraft.subjectId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>
      ${uploadDraft.subjectId? `<div class="field"><label>Category</label><div class="pill-select">${subjectById(uploadDraft.subjectId).categories.map(c=>`<div class="pill-opt ${uploadDraft.category===c?'selected':''}" onclick="uploadDraft.category='${c}';renderUploadModal();">${escapeHtml(c)}</div>`).join('')}</div></div>`:''}
    `;
    footer = [{label:'← Back', onClick:()=>{uploadStep=1;renderUploadModal();}}, {label:'Next →', primary:true, onClick:()=>{
      if(!uploadDraft.subjectId||!uploadDraft.category){ toast('Choose subject and category','error'); return; }
      uploadStep=3; renderUploadModal();
    }}];
  } else if(uploadStep===3){
    body = `
      <div class="step-indicator"><div class="done"></div><div class="done"></div><div class="done"></div></div>
      <div class="field"><label>Tags (comma separated)</label><input type="text" id="upTags" placeholder="#unit1, #important"></div>
      <div class="field-row">
        <div class="field"><label>Teacher</label><input type="text" id="upTeacher" placeholder="e.g. Dr. Rao"></div>
        <div class="field"><label>Unit / Chapter</label><input type="text" id="upUnit" placeholder="e.g. Unit 2"></div>
      </div>
      <div class="field"><label>Deadline (optional)</label><input type="date" id="upDeadline"></div>
      <div class="field"><label>Notes / description</label><textarea id="upDesc" placeholder="Optional notes"></textarea></div>
      <div class="text-muted" style="font-size:12px;">Uploading ${uploadDraft.files.length} file(s) to ${escapeHtml(subjectById(uploadDraft.subjectId).name)} → ${escapeHtml(uploadDraft.category)}</div>
    `;
    footer = [{label:'← Back', onClick:()=>{uploadStep=2;renderUploadModal();}}, {label:'Upload', primary:true, onClick:()=>finishUpload()}];
  }
  openModal(uploadStep==='quick'?'Quick Upload':'Upload File', body, footer, false, true);
  if(uploadDraft.files.length) renderFileListPreview();
}
let pendingFileObjs = [];
function handleDrop(e){ e.preventDefault(); e.currentTarget.classList.remove('drag'); handleFilePick(e.dataTransfer.files); }
function handleFilePick(fileList){
  pendingFileObjs = Array.from(fileList);
  uploadDraft.files = pendingFileObjs.map(f=>({name:f.name, size:f.size, type:extOf(f.name)}));
  renderFileListPreview();
  pendingFileObjs.forEach((fileObj, idx)=>{
    if(fileObj.size < 800000 && (fileObj.type.startsWith('image/') || fileObj.type==='application/pdf')){
      const reader = new FileReader();
      reader.onload = ()=>{ uploadDraft.files[idx].dataUrl = reader.result; };
      reader.readAsDataURL(fileObj);
    }
  });
}
function renderFileListPreview(){
  const el = document.getElementById('fileListPreview');
  if(!el) return;
  el.innerHTML = uploadDraft.files.map((f,i)=>`
    <div class="flex-between" style="padding:8px 0; border-bottom:1px solid var(--border);">
      <div style="display:flex; gap:8px; align-items:center; min-width:0;"><span>${iconFor(f.type)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(f.name)}</span></div>
      <div style="display:flex; align-items:center; gap:8px;"><span class="text-muted" style="font-size:12px;">${fmtSize(f.size)}</span><span style="color:var(--ok);font-size:12px;">✓ ready</span><button class="btn btn-sm btn-ghost" onclick="removeUploadFile(${i})">✕</button></div>
    </div>`).join('');
}
function removeUploadFile(i){ uploadDraft.files.splice(i,1); renderFileListPreview(); }
function finishUpload(){
  const tags = document.getElementById('upTags').value.split(',').map(t=>t.trim()).filter(Boolean).map(t=>t.startsWith('#')?t:'#'+t);
  const teacher = document.getElementById('upTeacher').value;
  const unit = document.getElementById('upUnit').value;
  const deadline = document.getElementById('upDeadline').value;
  const description = document.getElementById('upDesc').value;
  uploadDraft.files.forEach(f=>{
    DB.files.push({id:uid(), subjectId:uploadDraft.subjectId, category:uploadDraft.category, name:f.name, type:f.type, size:f.size,
      uploadedAt:nowISO(), lastOpenedAt:null, isFavorite:false, tags, teacher, description, unit, deadline, dataUrl:f.dataUrl||null});
  });
  save(); closeModal(); go('files'); toast(`${uploadDraft.files.length} file(s) uploaded`);
}
function finishQuickUpload(){
  if(uploadDraft.files.length===0){ toast('Select at least one file','error'); return; }
  // Inbox = ensure a catch-all subject exists
  let inboxSubj = DB.subjects.find(s=>s.name==='Inbox');
  if(!inboxSubj){
    let sem = DB.semesters[0];
    if(!sem){ toast('Create a semester first','error'); return; }
    inboxSubj = {id:uid(), semesterId: sem.id, name:'Inbox', code:'', color:'#9CA3AF', categories:['Unsorted']};
    DB.subjects.push(inboxSubj);
  }
  uploadDraft.files.forEach(f=>{
    DB.files.push({id:uid(), subjectId:inboxSubj.id, category:'Unsorted', name:f.name, type:f.type, size:f.size,
      uploadedAt:nowISO(), lastOpenedAt:null, isFavorite:false, tags:[], teacher:'', description:'', unit:'', deadline:'', dataUrl:f.dataUrl||null});
  });
  save(); closeModal(); go('files'); toast(`${uploadDraft.files.length} file(s) saved to Inbox — organize anytime`);
}

/* ================= TASKS ================= */
function renderTasks(){
  const tabs = [['today','Today'],['upcoming','Upcoming'],['overdue','Overdue'],['completed','Completed']];
  let list = DB.tasks;
  const today = todayStr();
  if(taskTab==='today') list = list.filter(t=>t.dueDate===today && t.status!=='completed');
  else if(taskTab==='upcoming') list = list.filter(t=>t.dueDate>today && t.status!=='completed');
  else if(taskTab==='overdue') list = list.filter(t=>t.dueDate<today && t.status!=='completed');
  else if(taskTab==='completed') list = list.filter(t=>t.status==='completed');
  list = [...list].sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  return `
    <div class="flex-between mb16"><h2>Tasks</h2><button class="btn btn-primary" onclick="openTaskModal()">＋ Add Task</button></div>
    <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${taskTab===k?'active':''}" onclick="taskTab='${k}';renderContent();">${l}</button>`).join('')}</div>
    ${list.length? list.map(t=>taskRowHtml(t,true)).join('') : emptyState('✅', taskTab==='completed'?'No completed tasks yet':'You\'re all caught up! 🎉', taskTab==='overdue'?'Nothing overdue — nice work staying on top of things.':'Add a task to get started.')}
  `;
}
function taskRowHtml(t, detailed){
  const subj = subjectById(t.subjectId);
  const prColor = t.priority==='high'?'var(--danger)':t.priority==='medium'?'var(--warn)':'var(--ok)';
  const done = t.status==='completed';
  const overdue = !done && t.dueDate && t.dueDate<todayStr();
  return `
    <div class="task-row">
      <div class="checkbox ${done?'checked':''}" onclick="toggleTaskDone('${t.id}')">${done?'✓':''}</div>
      <div style="flex:1; min-width:0;">
        <div class="flex-between">
          <span class="task-title ${done?'done':''}">${escapeHtml(t.title)}</span>
          <div style="display:flex; gap:6px; align-items:center;">
            ${detailed? `<button class="icon-btn" style="width:26px;height:26px;" onclick="openTaskModal('${t.id}')">✏️</button><button class="icon-btn" style="width:26px;height:26px;" onclick="deleteTask('${t.id}')">🗑️</button>` : ''}
          </div>
        </div>
        <div class="task-tags">
          <span class="dot" style="background:${prColor}"></span><span class="text-muted" style="font-size:12px; text-transform:capitalize;">${t.priority}</span>
          ${subj?`<span class="tag-pill">${escapeHtml(subj.name)}</span>`:''}
          ${t.dueDate? `<span class="badge ${overdue?'badge-danger':'badge-neutral'}">${overdue?'Overdue · ':''}${fmtDate(t.dueDate)}${t.dueTime?' · '+t.dueTime:''}</span>`:''}
          ${t.status==='in_progress'? `<span class="badge badge-accent">In progress</span>`:''}
          ${t.recurring && t.recurring!=='none'? `<span class="badge badge-neutral">🔁 ${t.recurring}</span>`:''}
        </div>
      </div>
    </div>`;
}
function toggleTaskDone(id){
  const t = DB.tasks.find(x=>x.id===id);
  if(t.status==='completed'){ t.status='todo'; t.completedAt=null; }
  else { t.status='completed'; t.completedAt=nowISO(); }
  save(); renderContent();
}
function deleteTask(id){ if(!confirm('Delete this task?')) return; DB.tasks = DB.tasks.filter(t=>t.id!==id); save(); renderContent(); }
function openTaskModal(taskId){
  const t = taskId ? DB.tasks.find(x=>x.id===taskId) : {title:'',description:'',subjectId:DB.subjects[0]?.id||'',priority:'medium',status:'todo',dueDate:todayStr(),dueTime:'',reminderMinutes:0,recurring:'none'};
  openModal(taskId?'Edit Task':'Add Task', `
    <div class="field"><label>Title</label><input type="text" id="tTitle" value="${escapeHtml(t.title)}" placeholder="e.g. Complete Mathematics Assignment"></div>
    <div class="field"><label>Description</label><textarea id="tDesc">${escapeHtml(t.description||'')}</textarea></div>
    <div class="field-row">
      <div class="field"><label>Subject</label><select id="tSubj">${DB.subjects.map(s=>`<option value="${s.id}" ${s.id===t.subjectId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Priority</label><select id="tPriority">${['low','medium','high'].map(p=>`<option value="${p}" ${p===t.priority?'selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Due date</label><input type="date" id="tDate" value="${t.dueDate||''}"></div>
      <div class="field"><label>Due time</label><input type="time" id="tTime" value="${t.dueTime||''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Status</label><select id="tStatus">${[['todo','To Do'],['in_progress','In Progress'],['completed','Completed']].map(([v,l])=>`<option value="${v}" ${v===t.status?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Reminder</label><select id="tReminder">${[[0,'None'],[10,'10 min before'],[30,'30 min before'],[60,'1 hour before'],[1440,'1 day before']].map(([v,l])=>`<option value="${v}" ${v==t.reminderMinutes?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Recurring</label><select id="tRecurring">${[['none','None'],['daily','Daily'],['weekly','Weekly']].map(([v,l])=>`<option value="${v}" ${v===t.recurring?'selected':''}>${l}</option>`).join('')}</select></div>
  `, [{label:taskId?'Save':'Create', primary:true, onClick:()=>{
    const data = {
      title: document.getElementById('tTitle').value.trim(),
      description: document.getElementById('tDesc').value,
      subjectId: document.getElementById('tSubj').value,
      priority: document.getElementById('tPriority').value,
      dueDate: document.getElementById('tDate').value,
      dueTime: document.getElementById('tTime').value,
      status: document.getElementById('tStatus').value,
      reminderMinutes: +document.getElementById('tReminder').value,
      recurring: document.getElementById('tRecurring').value,
    };
    if(!data.title){ toast('Title is required','error'); return; }
    if(taskId){ Object.assign(t, data); }
    else { DB.tasks.push({id:uid(), ...data, createdAt:nowISO(), completedAt: data.status==='completed'?nowISO():null}); }
    save(); closeModal(); go('tasks'); toast(taskId?'Task updated':'Task created');
  }}]);
}

/* ================= DEADLINES ================= */
let deadlineView = 'list';
function renderDeadlines(){
  return `
    <div class="flex-between mb16"><h2>Deadlines</h2>
      <div style="display:flex; gap:8px;">
        <button class="btn ${deadlineView==='list'?'btn-primary':''}" onclick="deadlineView='list';renderContent();">List</button>
        <button class="btn ${deadlineView==='calendar'?'btn-primary':''}" onclick="deadlineView='calendar';renderContent();">Calendar</button>
        <button class="btn btn-primary" onclick="openDeadlineModal()">＋ Add Deadline</button>
      </div>
    </div>
    ${deadlineView==='list' ? renderDeadlineList() : renderDeadlineCalendar()}
  `;
}
function renderDeadlineList(){
  const sorted = [...DB.deadlines].sort((a,b)=>a.date.localeCompare(b.date));
  if(!sorted.length) return emptyState('⏰','No deadlines yet','Track exams, submissions and project due dates here.', `<button class="btn btn-primary" onclick="openDeadlineModal()">+ Add Deadline</button>`);
  return `<div class="card card-pad">${sorted.map(d=>{
    const du = daysUntil(d.date);
    const status = d.completed? {l:'Completed', c:'badge-ok'} : du<0? {l:'Overdue', c:'badge-danger'} : du===0? {l:'Due today', c:'badge-warn'} : {l:fmtDate(d.date), c:'badge-neutral'};
    return `<div class="flex-between" style="padding:11px 0; border-bottom:1px solid var(--border);">
      <div style="display:flex; gap:10px; align-items:center;">
        <div class="checkbox ${d.completed?'checked':''}" onclick="toggleDeadline('${d.id}')">${d.completed?'✓':''}</div>
        <div><b style="font-size:13.5px;">${escapeHtml(d.title)}</b><div class="subtitle">${d.type} · ${subjectById(d.subjectId)?.name||'—'} ${d.time?'· '+d.time:''}</div></div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;"><span class="badge ${status.c}">${status.l}</span>
      <button class="icon-btn" style="width:26px;height:26px;" onclick="deleteDeadline('${d.id}')">🗑️</button></div>
    </div>`;
  }).join('')}</div>`;
}
function renderDeadlineCalendar(){
  const now = new Date(); now.setMonth(now.getMonth()+calMonthOffset);
  const year = now.getFullYear(), month = now.getMonth();
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const monthName = now.toLocaleString(undefined,{month:'long', year:'numeric'});
  let cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const dateStr = (d)=> `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  return `
    <div class="flex-between mb16">
      <button class="btn btn-sm" onclick="calMonthOffset--;renderContent();">← Prev</button>
      <b>${monthName}</b>
      <button class="btn btn-sm" onclick="calMonthOffset++;renderContent();">Next →</button>
    </div>
    <div class="cal-dowrow">${['S','M','T','W','T','F','S'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="calendar-grid">
      ${cells.map(d=>{
        if(!d) return `<div></div>`;
        const ds = dateStr(d);
        const items = DB.deadlines.filter(x=>x.date===ds);
        const isToday = ds===todayStr();
        return `<div class="cal-day ${isToday?'today':''}" onclick="showDayDeadlines('${ds}')">
          <div class="num">${d}</div>
          <div class="dots">${items.slice(0,4).map(it=>`<span class="dot" style="background:${it.completed?'var(--ok)':'var(--accent)'}"></span>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>`;
}
function showDayDeadlines(ds){
  const items = DB.deadlines.filter(d=>d.date===ds);
  openModal(fmtDate(ds), items.length? items.map(d=>`<div style="padding:8px 0; border-bottom:1px solid var(--border);"><b>${escapeHtml(d.title)}</b><div class="subtitle">${d.type} · ${d.time||''}</div></div>`).join('') : `<div class="text-muted">No deadlines this day.</div>`, [{label:'+ Add Deadline', primary:true, onClick:()=>{closeModal(); openDeadlineModal(ds);}}]);
}
function toggleDeadline(id){ const d=DB.deadlines.find(x=>x.id===id); d.completed=!d.completed; save(); renderContent(); }
function deleteDeadline(id){ if(!confirm('Delete this deadline?')) return; DB.deadlines=DB.deadlines.filter(d=>d.id!==id); save(); renderContent(); }
function openDeadlineModal(presetDate){
  openModal('Add Deadline', `
    <div class="field"><label>Title</label><input type="text" id="dTitle" placeholder="e.g. DBMS Mid-Sem Exam"></div>
    <div class="field-row">
      <div class="field"><label>Type</label><select id="dType">${['Assignment','Project','Exam','Quiz','Lab','Presentation','Other'].map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Subject</label><select id="dSubj">${DB.subjects.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Date</label><input type="date" id="dDate" value="${presetDate||todayStr()}"></div>
      <div class="field"><label>Time</label><input type="time" id="dTime" value="23:59"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="dDesc"></textarea></div>
  `, [{label:'Create', primary:true, onClick:()=>{
    const title = document.getElementById('dTitle').value.trim();
    if(!title){ toast('Title is required','error'); return; }
    DB.deadlines.push({id:uid(), title, type:document.getElementById('dType').value, subjectId:document.getElementById('dSubj').value,
      date:document.getElementById('dDate').value, time:document.getElementById('dTime').value, description:document.getElementById('dDesc').value, completed:false});
    save(); closeModal(); go('deadlines'); toast('Deadline added');
  }}]);
}

/* ================= FAVORITES ================= */
function renderFavorites(){
  const favs = DB.files.filter(f=>f.isFavorite);
  return `<h2 class="mb16">Favorites</h2>${favs.length? `<div class="card card-pad">${favs.map(f=>fileRowHtml(f)).join('')}</div>` : emptyState('⭐','No favorites yet','Star important notes, syllabi and exam material to find them instantly.')}`;
}

/* ================= FOCUS MODE ================= */
function renderFocus(){
  const sessions = DB.focusSessions.filter(s=>s.completed);
  const totalMins = sessions.reduce((a,s)=>a+s.duration,0);
  return `
    <div class="focus-shell" id="focusShell">
      ${focusState.running ? `
        <div class="text-muted">${escapeHtml(focusState.label)}</div>
        <div class="focus-timer" id="timerDisplay">25:00</div>
        <div style="display:flex; gap:10px;">
          <button class="btn" onclick="pauseFocus()">${focusState.paused?'▶ Resume':'⏸ Pause'}</button>
          <button class="btn btn-danger" onclick="endFocus()">■ End Session</button>
        </div>
        <div class="text-muted mt24" style="font-size:12px;">${sessions.length} sessions completed · ${Math.round(totalMins/60*10)/10}h focused total</div>
      ` : `
        <h2>Focus Mode</h2>
        <div class="subtitle mb16">Pick a subject and duration, then start a distraction-free session.</div>
        <div class="field" style="width:280px;"><label>Subject / Task</label>
          <select id="focusSubj" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--surface);">
            <option value="">Free study</option>
            ${DB.subjects.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}
          </select>
        </div>
        <div class="preset-row">
          ${[25,45,60].map(m=>`<button class="btn" onclick="setFocusPreset(${m})" id="preset-${m}">${m} min</button>`)}
          <input type="number" id="customMin" placeholder="Custom" style="width:80px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--surface);">
        </div>
        <button class="btn btn-primary mt24" style="padding:12px 28px;" onclick="startFocus()">▶ Start Focus</button>
        <div class="grid grid-3 mt24" style="width:100%; max-width:480px;">
          <div class="card card-pad" style="text-align:center;"><div class="stat-num">${sessions.length}</div><div class="stat-label">Sessions</div></div>
          <div class="card card-pad" style="text-align:center;"><div class="stat-num">${Math.round(totalMins/60*10)/10}h</div><div class="stat-label">Focus time</div></div>
          <div class="card card-pad" style="text-align:center;"><div class="stat-num">${sessions.filter(s=>new Date(s.completedAt).toDateString()===new Date().toDateString()).length}</div><div class="stat-label">Today</div></div>
        </div>
        <div class="text-muted mt24" style="font-size:11.5px; max-width:420px;">Focus Mode minimizes in-app UI and tracks sessions. This demo cannot block other apps or websites on your device — that would require a separate browser extension or OS-level integration, structured as a future add-on.</div>
      `}
    </div>`;
}
let selectedPreset = 25;
function setFocusPreset(m){ selectedPreset = m; document.getElementById('customMin').value=''; }
function startFocus(){
  const custom = +document.getElementById('customMin').value;
  const mins = custom>0 ? custom : selectedPreset;
  const subjectId = document.getElementById('focusSubj').value || null;
  focusState = { running:true, paused:false, remaining:mins*60, total:mins*60, subjectId, taskId:null, label: subjectId? subjectById(subjectId).name : 'Free study', timerId:null };
  renderContent();
  initFocusUI();
}
function initFocusUI(){
  if(!focusState.running) return;
  updateTimerDisplay();
  clearInterval(focusState.timerId);
  focusState.timerId = setInterval(()=>{
    if(focusState.paused) return;
    focusState.remaining--;
    if(focusState.remaining<=0){ completeFocus(); return; }
    updateTimerDisplay();
  },1000);
}
function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  const m = Math.floor(focusState.remaining/60), s = focusState.remaining%60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function pauseFocus(){ focusState.paused=!focusState.paused; renderContent(); initFocusUI(); }
function completeFocus(){
  clearInterval(focusState.timerId);
  DB.focusSessions.push({id:uid(), subjectId:focusState.subjectId, duration:Math.round(focusState.total/60), startedAt:nowISO(), completedAt:nowISO(), completed:true});
  save();
  toast('Focus session complete! 🎉');
  if('Notification' in window && Notification.permission==='granted'){ new Notification('Focus session complete', {body:'Nice work — take a short break.'}); }
  focusState.running=false;
  renderContent();
}
function endFocus(){
  clearInterval(focusState.timerId);
  const elapsed = Math.round((focusState.total-focusState.remaining)/60);
  if(elapsed>0){ DB.focusSessions.push({id:uid(), subjectId:focusState.subjectId, duration:elapsed, startedAt:nowISO(), completedAt:nowISO(), completed:true}); save(); }
  focusState.running=false;
  renderContent();
  toast('Session ended');
}

/* ================= STATISTICS ================= */
function renderStats(){
  const tasksCompleted = DB.tasks.filter(t=>t.status==='completed').length;
  const tasksPending = DB.tasks.filter(t=>t.status!=='completed').length;
  const filesAdded = DB.files.length;
  const sessions = DB.focusSessions.filter(s=>s.completed);
  const focusMins = sessions.reduce((a,s)=>a+s.duration,0);
  const upcomingDeadlines = DB.deadlines.filter(d=>!d.completed && d.date>=todayStr()).length;
  const bySubject = DB.subjects.map(s=>({name:s.name, count:DB.files.filter(f=>f.subjectId===s.id).length})).sort((a,b)=>b.count-a.count);
  const maxCount = Math.max(1,...bySubject.map(s=>s.count));
  return `
    <h2 class="mb16">Statistics</h2>
    <div class="grid grid-4 mb16">
      <div class="card card-pad"><div class="stat-num">${tasksCompleted}</div><div class="stat-label">Tasks completed</div></div>
      <div class="card card-pad"><div class="stat-num">${tasksPending}</div><div class="stat-label">Tasks pending</div></div>
      <div class="card card-pad"><div class="stat-num">${filesAdded}</div><div class="stat-label">Files added</div></div>
      <div class="card card-pad"><div class="stat-num">${upcomingDeadlines}</div><div class="stat-label">Upcoming deadlines</div></div>
      <div class="card card-pad"><div class="stat-num">${sessions.length}</div><div class="stat-label">Focus sessions</div></div>
      <div class="card card-pad"><div class="stat-num">${Math.round(focusMins/60*10)/10}h</div><div class="stat-label">Focus time</div></div>
      <div class="card card-pad"><div class="stat-num">${DB.deadlines.filter(d=>d.completed).length}</div><div class="stat-label">Assignments completed</div></div>
      <div class="card card-pad"><div class="stat-num">${DB.files.filter(f=>f.isFavorite).length}</div><div class="stat-label">Favorited files</div></div>
    </div>
    <div class="section-title">Files by subject</div>
    <div class="card card-pad">
      ${bySubject.length? bySubject.map(s=>`<div class="bar-row"><div class="lbl">${escapeHtml(s.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${(s.count/maxCount)*100}%"></div></div><div class="bar-val">${s.count}</div></div>`).join('') : `<div class="text-muted">No subjects yet.</div>`}
    </div>
  `;
}

/* ================= SETTINGS ================= */
function renderSettings(){
  return `
    <h2 class="mb16">Settings</h2>
    <div class="card card-pad mb16">
      <div class="section-title">Profile</div>
      <div class="field"><label>Name</label><input type="text" id="setName" value="${escapeHtml(DB.user.name)}"></div>
      <div class="field"><label>Email</label><input type="text" id="setEmail" value="${escapeHtml(DB.user.email)}"></div>
      <button class="btn btn-primary" onclick="saveProfile()">Save Profile</button>
    </div>
    <div class="card card-pad mb16">
      <div class="section-title">Appearance</div>
      <div class="flex-between"><span>Theme</span><button class="btn" onclick="toggleTheme()">${DB.ui.theme==='light'?'Switch to Dark':'Switch to Light'}</button></div>
    </div>
    <div class="card card-pad mb16">
      <div class="section-title">Notifications</div>
      <div class="flex-between"><span>Browser reminders for tasks & deadlines</span><button class="btn" onclick="requestNotifPermission()">${('Notification' in window && Notification.permission==='granted')?'Enabled ✓':'Enable'}</button></div>
    </div>
    <div class="card card-pad">
      <div class="section-title">Data</div>
      <div class="text-muted" style="font-size:12.5px; margin-bottom:10px;">This demo stores your data securely and privately tied to your account. For real multi-device cloud storage and file hosting, deploy the production backend (schema + setup provided separately).</div>
      <button class="btn btn-danger" onclick="resetDemoData()">Reset demo data</button>
    </div>
  `;
}
function saveProfile(){ DB.user.name=document.getElementById('setName').value||'Student'; DB.user.email=document.getElementById('setEmail').value; save(); render(); toast('Profile saved'); }
function requestNotifPermission(){
  if(!('Notification' in window)){ toast('Notifications not supported in this browser','error'); return; }
  Notification.requestPermission().then(p=>{ if(p==='granted') toast('Notifications enabled'); renderContent(); });
}
function resetDemoData(){
  if(!confirm('This will erase all your data and reload sample content. Continue?')) return;
  DB = {user:{name:'Student', email:'you@studify.app'}, years:[], semesters:[], subjects:[], files:[], tasks:[], deadlines:[], focusSessions:[], ui:{currentYearId:null,currentSemesterId:null,theme:DB.ui.theme}};
  seedDemoData(); save(); go('dashboard'); toast('Demo data reset');
}

/* ================= MODAL ================= */
function openModal(title, bodyHtml, buttons=[], noHeader, wide){
  document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal ${wide?'modal-wide':''}">
      <div class="modal-header"><h3>${escapeHtml(title)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
      ${buttons.length? `<div class="modal-footer">${buttons.map((b,i)=>`<button class="btn ${b.primary?'btn-primary':''}" id="modalBtn${i}">${b.label}</button>`).join('')}</div>` : ''}
    </div>`;
  document.body.appendChild(overlay);
  buttons.forEach((b,i)=>{ document.getElementById('modalBtn'+i).onclick = b.onClick; });
}
function closeModal(){ document.querySelectorAll('.modal-overlay').forEach(m=>m.remove()); }
window.onkeydown = (e)=>{ if(e.key==='Escape') closeModal(); };

/* ================= REMINDER CHECK (lightweight) ================= */
setInterval(()=>{
  const now = new Date();
  DB.tasks.forEach(t=>{
    if(t.status==='completed' || !t.dueDate || !t.reminderMinutes || t.__reminded) return;
    const due = new Date(t.dueDate+'T'+(t.dueTime||'23:59'));
    const remindAt = new Date(due.getTime() - t.reminderMinutes*60000);
    if(now>=remindAt && now<due){
      t.__reminded = true;
      toast(`Reminder: "${t.title}" is due ${t.dueTime?('at '+t.dueTime):'today'}`);
      if('Notification' in window && Notification.permission==='granted'){ new Notification('Studify reminder', {body:`${t.title} is coming up`}); }
    }
  });
}, 30000);

/* ================= BOOT ================= */
(async function boot(){
  await load();
  render();
})();
</script>
